<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCX Team Quiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --teal: #00C8A0;
    --teal-dim: #009E7E;
    --bg: #0a0f1a;
    --surface: #131c2e;
    --surface2: #1a2640;
    --text: #e8f0ff;
    --muted: #7a91b5;
    --correct: #34d399;
    --wrong: #f87171;
    --gold: #fbbf24;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  /* --- SCREENS --- */
  .screen { display: none; width: 100%; max-width: 780px; }
  .screen.active { display: flex; flex-direction: column; align-items: center; gap: 24px; }

  /* --- INTRO --- */
  .logo-pill {
    background: var(--teal);
    color: #000;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: .06em;
    padding: 6px 16px;
    border-radius: 100px;
    text-transform: uppercase;
  }

  .intro-title {
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 800;
    text-align: center;
    line-height: 1.1;
    background: linear-gradient(135deg, #e8f0ff 30%, var(--teal));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .intro-sub {
    color: var(--muted);
    text-align: center;
    font-size: 15px;
    max-width: 440px;
    line-height: 1.6;
  }

  .stats-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .stat-chip {
    background: var(--surface);
    border: 1px solid var(--surface2);
    border-radius: 12px;
    padding: 14px 22px;
    text-align: center;
  }

  .stat-chip .num {
    font-size: 2rem;
    font-weight: 800;
    color: var(--teal);
    display: block;
  }

  .stat-chip .lbl {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .btn {
    background: var(--teal);
    color: #000;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    padding: 16px 48px;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }

  .btn:hover { background: var(--teal-dim); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--surface2);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 24px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }

  .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

  /* --- QUIZ --- */
  .progress-bar-wrap {
    width: 100%;
    height: 4px;
    background: var(--surface2);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--teal);
    border-radius: 4px;
    transition: width .4s ease;
  }

  .q-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    font-size: 13px;
    color: var(--muted);
  }

  .q-category {
    background: var(--surface2);
    padding: 4px 12px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
    color: var(--teal);
  }

  .q-text {
    font-size: clamp(1.1rem, 3.5vw, 1.5rem);
    font-weight: 700;
    text-align: center;
    line-height: 1.35;
    padding: 0 8px;
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
  }

  @media (max-width: 520px) { .options-grid { grid-template-columns: 1fr; } }

  .opt-btn {
    background: var(--surface);
    border: 2px solid var(--surface2);
    color: var(--text);
    border-radius: 14px;
    padding: 18px 20px;
    font-size: 14px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
    line-height: 1.4;
    min-height: 64px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .opt-btn .opt-letter {
    min-width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
    color: var(--muted);
    flex-shrink: 0;
    transition: background .15s, color .15s;
  }

  .opt-btn:hover:not(:disabled) {
    border-color: var(--teal);
    transform: translateY(-2px);
  }

  .opt-btn:hover:not(:disabled) .opt-letter {
    background: var(--teal);
    color: #000;
  }

  .opt-btn.correct {
    border-color: var(--correct);
    background: rgba(52, 211, 153, .08);
  }

  .opt-btn.correct .opt-letter { background: var(--correct); color: #000; }

  .opt-btn.wrong {
    border-color: var(--wrong);
    background: rgba(248, 113, 113, .08);
  }

  .opt-btn.wrong .opt-letter { background: var(--wrong); color: #000; }

  .opt-btn:disabled { cursor: default; }

  .feedback-box {
    width: 100%;
    padding: 16px 20px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    display: none;
  }

  .feedback-box.correct-fb {
    background: rgba(52, 211, 153, .1);
    border: 1px solid rgba(52, 211, 153, .3);
    color: var(--correct);
  }

  .feedback-box.wrong-fb {
    background: rgba(248, 113, 113, .1);
    border: 1px solid rgba(248, 113, 113, .3);
    color: #fca5a5;
  }

  .feedback-box strong { font-weight: 700; }

  .nav-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    width: 100%;
  }

  /* --- RESULTS --- */
  .score-ring-wrap {
    position: relative;
    width: 160px;
    height: 160px;
  }

  .score-ring-wrap svg { transform: rotate(-90deg); }

  .score-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .score-pct {
    font-size: 2.4rem;
    font-weight: 800;
    color: var(--teal);
  }

  .score-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .06em;
  }

  .result-title {
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 800;
    text-align: center;
  }

  .result-summary {
    color: var(--muted);
    text-align: center;
    font-size: 14px;
    max-width: 400px;
    line-height: 1.6;
  }

  .answers-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 320px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .answers-list::-webkit-scrollbar { width: 4px; }
  .answers-list::-webkit-scrollbar-track { background: var(--surface); border-radius: 4px; }
  .answers-list::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }

  .ans-row {
    background: var(--surface);
    border-radius: 10px;
    padding: 12px 16px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 13px;
  }

  .ans-icon {
    font-size: 16px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .ans-q { color: var(--muted); margin-bottom: 3px; }
  .ans-a { color: var(--text); font-weight: 500; }

  .fun-badge {
    background: linear-gradient(135deg, #7c3aed, #db2777);
    padding: 2px 10px;
    border-radius: 100px;
    font-size: 10px;
    font-weight: 700;
    margin-left: 8px;
    vertical-align: middle;
  }

  /* --- LIVE QUESTION --- */
  .live-hint {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: -8px;
  }

  .live-input-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
  }

  .live-input {
    background: var(--surface);
    border: 2px solid var(--surface2);
    color: var(--text);
    border-radius: 14px;
    font-size: 2rem;
    font-weight: 800;
    text-align: center;
    width: 220px;
    padding: 18px 16px;
    outline: none;
    transition: border-color .2s;
    font-family: 'Inter', sans-serif;
    -moz-appearance: textfield;
  }

  .live-input::-webkit-inner-spin-button,
  .live-input::-webkit-outer-spin-button { -webkit-appearance: none; }

  .live-input:focus { border-color: var(--teal); }

  .live-reveal-box {
    background: var(--surface2);
    border: 1px solid var(--teal);
    border-radius: 14px;
    padding: 20px 32px;
    text-align: center;
    display: none;
    width: 100%;
  }

  .live-reveal-num {
    font-size: 3rem;
    font-weight: 800;
    color: var(--teal);
    display: block;
  }

  .live-reveal-unit {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    display: block;
  }

  .live-reveal-note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.5;
  }

  .live-badge {
    background: linear-gradient(135deg, #0ea5e9, #6366f1);
    padding: 2px 10px;
    border-radius: 100px;
    font-size: 10px;
    font-weight: 700;
    margin-left: 8px;
    vertical-align: middle;
  }
</style>
</head>
<body>

<!-- ===================== INTRO SCREEN ===================== -->
<div class="screen active" id="screen-intro">
  <div class="logo-pill">The Collective X</div>

  <h1 class="intro-title">Team Quiz 🎯</h1>

  <div class="stats-row">
    <div class="stat-chip"><span class="num">23</span><span class="lbl">Partners</span></div>
    <div class="stat-chip"><span class="num">1,256</span><span class="lbl">Enrolments</span></div>
    <div class="stat-chip"><span class="num">991</span><span class="lbl">SFIA Level 2</span></div>
    <div class="stat-chip"><span class="num">228</span><span class="lbl">Placed after WIL</span></div>
  </div>

  <button class="btn" onclick="startQuiz()">Let's go →</button>
</div>

<!-- ===================== QUIZ SCREEN ===================== -->
<div class="screen" id="screen-quiz">
  <div class="progress-bar-wrap" style="width:100%">
    <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
  </div>

  <div class="q-meta">
    <span id="q-counter">Question 1 of 20</span>
    <span class="q-category" id="q-cat">Programme</span>
  </div>

  <p class="q-text" id="q-text"></p>

  <div class="options-grid" id="options-grid"></div>

  <div class="feedback-box" id="feedback-box"></div>

  <div class="nav-row">
    <button class="btn-ghost" onclick="skipQuestion()">Skip</button>
    <button class="btn" id="btn-next" onclick="nextQuestion()" style="display:none">Next →</button>
  </div>
</div>

<!-- ===================== RESULTS SCREEN ===================== -->
<div class="screen" id="screen-results">
  <div class="logo-pill">Results</div>

  <div class="score-ring-wrap">
    <svg width="160" height="160" viewBox="0 0 160 160">
      <circle cx="80" cy="80" r="68" fill="none" stroke="#1a2640" stroke-width="14"/>
      <circle cx="80" cy="80" r="68" fill="none" stroke="#00C8A0" stroke-width="14"
              stroke-dasharray="427" id="score-arc" stroke-dashoffset="427"
              stroke-linecap="round"/>
    </svg>
    <div class="score-center">
      <span class="score-pct" id="score-pct">0%</span>
      <span class="score-label">correct</span>
    </div>
  </div>

  <h2 class="result-title" id="result-title">Well done!</h2>
  <p class="result-summary" id="result-summary"></p>

  <div class="answers-list" id="answers-list"></div>

  <button class="btn" onclick="resetQuiz()">Play again</button>
</div>

<script>
const questions = [
  // ── PROGRAMME & ELIGIBILITY ──
  {
    cat: "Programme",
    q: "What does WIL stand for?",
    opts: ["Work Incentive Ladder", "Work-Integrated Learning", "Workplace Implementation Level", "Workforce Integration Link"],
    ans: 1,
    exp: "WIL stands for Work-Integrated Learning — structured, supervised learning where beneficiaries apply their skills in a real workplace."
  },
  {
    cat: "Eligibility",
    q: "What is the age range for an 'Unemployed Youth' beneficiary on the programme?",
    opts: ["16–30", "18–35", "18–34", "21–35"],
    ans: 2,
    exp: "Beneficiaries must be aged 18 to 34 at the time of enrolment."
  },
  {
    cat: "Eligibility",
    q: "Is a matric certificate required to join the programme as a beneficiary?",
    opts: ["Yes, always", "Only for WIL-only pathway", "No, but a knowledge assessment is required", "Only for SFIA Level 3"],
    ans: 2,
    exp: "A matric certificate is NOT required. Beneficiaries must pass a SFIA Level 2 knowledge assessment aligned to their job role."
  },
  {
    cat: "Eligibility",
    q: "Can foreign nationals with valid work permits participate in the programme?",
    opts: ["Yes, any valid permit qualifies", "Yes, but only permanent residents", "No — South African citizenship is required", "Only if they've lived in SA for 5+ years"],
    ans: 2,
    exp: "The programme requires South African citizenship. Foreign nationals with valid permits are not eligible, though naturalised citizens are."
  },
  {
    cat: "Eligibility",
    q: "What is the Black African representation target for beneficiary selection?",
    opts: ["70%", "75%", "80%", "85%"],
    ans: 3,
    exp: "The target demographic for Black African representation is 85%."
  },

  // ── SFIA & SKILLS ──
  {
    cat: "SFIA",
    q: "What does SFIA stand for?",
    opts: ["Skills for the Future in Africa", "Skills Framework for the Information Age", "South African Financing and Implementation Act", "Sector Funding and Inclusion Agreement"],
    ans: 1,
    exp: "SFIA = Skills Framework for the Information Age — the industry standard for defining and measuring ICT skill levels."
  },
  {
    cat: "SFIA",
    q: "What SFIA level must beneficiaries demonstrate to successfully complete the programme?",
    opts: ["SFIA Level 1", "SFIA Level 2", "SFIA Level 3", "SFIA Level 4"],
    ans: 2,
    exp: "Beneficiaries must achieve SFIA Level 3 proficiency in their selected skills to complete the programme."
  },
  {
    cat: "SFIA",
    q: "Who is Collective X's SFIA assessment and accreditation partner?",
    opts: ["SAQA", "CIPC", "SkillsTX", "Experian"],
    ans: 2,
    exp: "SkillsTX is Collective X's partner for SFIA accreditation and beneficiary competence assessment."
  },

  // ── FINANCING & MILESTONES ──
  {
    cat: "Financing",
    q: "How many major milestones trigger a Collective X co-payment?",
    opts: ["2", "3", "4", "5"],
    ans: 1,
    exp: "There are 3 milestones: Milestone 1 = SFIA Level 2 + WIL enrolment; Milestone 2 = SFIA Level 3 completion; Milestone 3 = absorption into employment."
  },
  {
    cat: "Financing",
    q: "Does Collective X co-payment cover the foundation training phase?",
    opts: ["Yes, fully", "Yes, up to 50%", "No — it applies to the WIL phase only", "Only if the provider is pre-vetted"],
    ans: 2,
    exp: "Collective X co-payment applies to the WIL phase only, unless expressly stated otherwise for a specific funding window."
  },
  {
    cat: "Financing",
    q: "What is Collective X's milestone payment turnaround once evidence is verified and an invoice submitted?",
    opts: ["5 working days", "10 working days", "20 working days", "30 working days"],
    ans: 1,
    exp: "Payments are made within 10 working days once evidence is accurate, complete, and audited."
  },
  {
    cat: "Financing",
    q: "Who submits milestone evidence to Collective X and receives the payment?",
    opts: ["The Training Provider", "The Beneficiary", "The Employer or Aggregator", "SAQA"],
    ans: 2,
    exp: "The Employer or Aggregator submits evidence via the online partner portal and is the sole recipient of milestone payments."
  },

  // ── DASHBOARD (live — no right/wrong, reveal current figure) ──
  {
    cat: "📊 Dashboard",
    type: "live",
    q: "How many total enrolments are currently on the PSC dashboard? Take a guess!",
    reveal: "1,256",
    unit: "enrolments",
    exp: "Total Enrolments tracks every beneficiary who has enrolled on the programme to date. Update this number before each quiz session to keep it current."
  },
  {
    cat: "📊 Dashboard",
    type: "live",
    q: "How many beneficiaries have been placed after completing WIL?",
    reveal: "228",
    unit: "placements",
    exp: "Placement After WIL is our most downstream milestone — beneficiaries who completed WIL and moved into a quality work opportunity. Update this before each quiz."
  },
  {
    cat: "📊 Dashboard",
    type: "live",
    q: "How many contracted partners do we currently have on the programme?",
    reveal: "23",
    unit: "partners",
    exp: "Contracted Partners shows the number of Employers and Aggregators signed up under an Implementation Agreement. Update this before each quiz."
  },
  {
    cat: "📊 Dashboard",
    type: "live",
    q: "How many beneficiaries have completed SFIA Level 2 so far?",
    reveal: "991",
    unit: "completed SFIA L2",
    exp: "Completed SFIA Level 2 is Milestone 1 — the first verified checkpoint on the Route to Competence. Update this before each quiz."
  },

  // ── 🇿🇦 FUN — SA Q1 (spread away from Q2 below) ──
  {
    cat: "🇿🇦 SA General Knowledge",
    q: "Which South African city is known as the 'Mother City'?",
    opts: ["Johannesburg", "Pretoria", "Cape Town", "Durban"],
    ans: 2,
    exp: "Cape Town is affectionately called the 'Mother City' — South Africa's oldest city, established in 1652."
  },

  // ── CONTRACTING ──
  {
    cat: "Contracting",
    q: "What is the main contract between Collective X and the Employer or Aggregator called?",
    opts: ["Service Level Agreement", "Tripartite Training Agreement", "Implementation Agreement", "Letter of Intent"],
    ans: 2,
    exp: "The Implementation Agreement is the main contract between Collective X and the Employer/Aggregator."
  },
  {
    cat: "Contracting",
    q: "What minimum proportion of beneficiaries must employers typically commit to absorbing?",
    opts: ["50%", "60%", "70%", "80%"],
    ans: 2,
    exp: "Employers are typically expected to absorb at least 70% of beneficiaries into quality work opportunities."
  },

  // ── 🎉 FUN — GENERAL Q2 ──
  {
    cat: "🌍 General Knowledge",
    q: "Which country is the only one in the world with three capital cities — an administrative, a legislative, and a judicial capital?",
    opts: ["Bolivia", "South Africa", "Belgium", "Malaysia"],
    ans: 1,
    exp: "South Africa has three capitals: Pretoria (executive/administrative), Cape Town (legislative), and Bloemfontein (judicial). Very few countries split capital functions this way!"
  },

  // ── 🎉 FUN — EVAN Q3 ──
  {
    cat: "🎧 Fun",
    type: "trick",
    q: "Where will Evan be DJing on 8 December?",
    opts: ["🇲🇺 Mauritius", "🇪🇸 Ibiza", "🇧🇷 Brazil", "🇮🇩 Bali"],
    exp: "None of the above — but hit our targets and there's a first class ticket waiting! 🎟️✈️ Get to work! 🎧"
  },
];

let current = 0;
let score = 0;
let answered = [];

function startQuiz() {
  showScreen('screen-quiz');
  renderQuestion();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderQuestion() {
  const q = questions[current];
  const total = questions.length;
  const pct = (current / total) * 100;

  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('q-counter').textContent = `Question ${current + 1} of ${total}`;
  document.getElementById('q-cat').textContent = q.cat;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('feedback-box').style.display = 'none';
  document.getElementById('btn-next').style.display = 'none';

  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';

  if (q.type === 'live') {
    // Live dashboard question — free-text guess, then reveal
    grid.style.gridTemplateColumns = '1fr';
    grid.innerHTML = `
      <p class="live-hint">No right or wrong — just your best guess! We'll reveal the current figure.</p>
      <div class="live-input-wrap">
        <input class="live-input" id="live-input" type="text" placeholder="Your guess…" 
               oninput="document.getElementById('btn-reveal').style.display='inline-block'"/>
        <button class="btn" id="btn-reveal" onclick="revealLive()" style="display:none">Reveal the answer →</button>
        <div class="live-reveal-box" id="live-reveal-box">
          <span class="live-reveal-num" id="live-reveal-num"></span>
          <span class="live-reveal-unit" id="live-reveal-unit"></span>
          <p class="live-reveal-note" id="live-reveal-note"></p>
        </div>
      </div>`;
    // Allow pressing Enter to reveal
    setTimeout(() => {
      const inp = document.getElementById('live-input');
      if (inp) inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') revealLive();
      });
    }, 50);
  } else {
    grid.style.gridTemplateColumns = '';
    const letters = ['A', 'B', 'C', 'D'];
    q.opts.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
      btn.onclick = () => selectAnswer(i, btn);
      grid.appendChild(btn);
    });
  }
}

function selectAnswer(idx, btn) {
  const q = questions[current];
  const allBtns = document.querySelectorAll('.opt-btn');
  allBtns.forEach(b => b.disabled = true);

  const fb = document.getElementById('feedback-box');

  if (q.type === 'trick') {
    // No right or wrong — just reveal the punchline
    btn.style.borderColor = 'var(--gold)';
    btn.querySelector('.opt-letter').style.background = 'var(--gold)';
    btn.querySelector('.opt-letter').style.color = '#000';
    answered.push({ q: q.q, a: q.opts[idx], correct: null, trick: true, exp: q.exp });
    fb.className = 'feedback-box correct-fb';
    fb.style.borderColor = 'rgba(251,191,36,.4)';
    fb.style.background = 'rgba(251,191,36,.08)';
    fb.style.color = 'var(--gold)';
    fb.innerHTML = `<strong>✈️ Plot twist!</strong> ${q.exp}`;
  } else {
    const correct = idx === q.ans;
    if (correct) {
      btn.classList.add('correct');
      score++;
      answered.push({ q: q.q, a: q.opts[idx], correct: true });
      fb.className = 'feedback-box correct-fb';
      fb.innerHTML = `<strong>✓ Correct!</strong> ${q.exp}`;
    } else {
      btn.classList.add('wrong');
      allBtns[q.ans].classList.add('correct');
      answered.push({ q: q.q, a: q.opts[idx], correct: false, correctA: q.opts[q.ans] });
      fb.className = 'feedback-box wrong-fb';
      fb.innerHTML = `<strong>✗ Not quite.</strong> ${q.exp}`;
    }
  }

  fb.style.display = 'block';
  document.getElementById('btn-next').style.display = 'inline-block';
}

function revealLive() {
  const q = questions[current];
  const inp = document.getElementById('live-input');
  const guess = inp ? inp.value.trim() : '—';

  document.getElementById('live-reveal-num').textContent = q.reveal;
  document.getElementById('live-reveal-unit').textContent = q.unit;
  document.getElementById('live-reveal-note').textContent = q.exp;
  document.getElementById('live-reveal-box').style.display = 'block';
  document.getElementById('btn-reveal').style.display = 'none';
  if (inp) inp.disabled = true;

  answered.push({ q: q.q, a: guess, correct: null, reveal: q.reveal, unit: q.unit, live: true });
  document.getElementById('btn-next').style.display = 'inline-block';
}

function skipQuestion() {
  const q = questions[current];
  if (q.type === 'live') {
    const inp = document.getElementById('live-input');
    if (inp && !inp.disabled) revealLive();
  } else if (q.type === 'trick') {
    answered.push({ q: q.q, a: '—', trick: true });
    nextQuestion();
  } else {
    answered.push({ q: q.q, a: '—', correct: false, correctA: q.opts[q.ans], skipped: true });
    nextQuestion();
  }
}

function nextQuestion() {
  current++;
  if (current >= questions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('progress-bar').style.width = '100%';
  showScreen('screen-results');

  // Score only counts non-live questions
  const scorable = questions.filter(q => q.type !== 'live' && q.type !== 'trick').length;
  const pct = scorable > 0 ? Math.round((score / scorable) * 100) : 0;

  // Animate ring
  const circ = 2 * Math.PI * 68;
  const offset = circ - (pct / 100) * circ;
  setTimeout(() => {
    document.getElementById('score-arc').style.transition = 'stroke-dashoffset 1s ease';
    document.getElementById('score-arc').style.strokeDashoffset = offset;
  }, 100);

  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('score-label') && (document.getElementById('score-label').textContent = `of ${scorable} questions`);

  let title, summary;
  if (pct >= 90) { title = "Quiz Champion! 🏆"; summary = "Outstanding — you know this programme inside out. Grab a coffee, you've earned it."; }
  else if (pct >= 70) { title = "Sharp! 🎉"; summary = "Strong performance. You've clearly been paying attention. A quick FAQ refresh will get you to 100%."; }
  else if (pct >= 50) { title = "Solid effort 👍"; summary = "Good start! The Financing FAQ page is your friend — a quick read will fill any gaps."; }
  else { title = "Keep learning 📚"; summary = "No worries — visit thecollectivex.org/financing-faq/ and try again. Growth mindset!"; }

  document.getElementById('result-title').textContent = title;
  document.getElementById('result-summary').textContent = summary;

  const list = document.getElementById('answers-list');
  list.innerHTML = '';
  answered.forEach(a => {
    const row = document.createElement('div');
    row.className = 'ans-row';
    const isFun = a.q.includes('Mother City') || a.q.includes('three capital') || a.q.includes('DJing');
    const saBadge = isFun ? '<span class="fun-badge">🎉 Fun</span>' : '';
    const liveBadge = a.live ? '<span class="live-badge">📊 Live</span>' : '';

    if (a.live) {
      row.innerHTML = `<span class="ans-icon">📊</span><div>
        <div class="ans-q">${a.q}${liveBadge}</div>
        <div class="ans-a" style="color:var(--muted)">Your guess: ${a.a || '—'}</div>
        <div class="ans-a" style="color:var(--teal);font-size:12px">Current figure: ${a.reveal} ${a.unit}</div></div>`;
    } else if (a.trick) {
      row.innerHTML = `<span class="ans-icon">✈️</span><div>
        <div class="ans-q">${a.q}<span class="fun-badge">🎧 Fun</span></div>
        <div class="ans-a" style="color:var(--gold)">None of the above — hit targets for the first class ticket!</div></div>`;
    } else if (a.correct) {
      row.innerHTML = `<span class="ans-icon">✅</span><div>
        <div class="ans-q">${a.q}${saBadge}</div>
        <div class="ans-a">${a.a}</div></div>`;
    } else if (a.skipped) {
      row.innerHTML = `<span class="ans-icon">⏭️</span><div>
        <div class="ans-q">${a.q}${saBadge}</div>
        <div class="ans-a" style="color:var(--muted)">Skipped — answer: ${a.correctA}</div></div>`;
    } else {
      row.innerHTML = `<span class="ans-icon">❌</span><div>
        <div class="ans-q">${a.q}${saBadge}</div>
        <div class="ans-a" style="color:var(--wrong)">You said: ${a.a}</div>
        <div class="ans-a" style="color:var(--correct);font-size:12px">✓ ${a.correctA}</div></div>`;
    }
    list.appendChild(row);
  });
}

function resetQuiz() {
  current = 0; score = 0; answered = [];
  showScreen('screen-intro');
  document.getElementById('progress-bar').style.width = '0%';
  document.getElementById('score-arc').style.transition = 'none';
  document.getElementById('score-arc').style.strokeDashoffset = '427';
}
</script>
</body>
</html>
