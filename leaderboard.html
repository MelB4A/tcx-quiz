<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCX Quiz Leaderboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --teal: #00C8A0; --bg: #0a0f1a; --surface: #131c2e;
    --surface2: #1a2640; --text: #e8f0ff; --muted: #7a91b5;
    --gold: #fbbf24; --silver: #cbd5e1; --bronze: #cd7c4a;
  }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 24px;
    gap: 32px;
  }

  /* HEADER */
  .header {
    width: 100%;
    max-width: 900px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .logo-pill { background: var(--teal); color: #000; font-weight: 800; font-size: 13px; letter-spacing: .06em; padding: 6px 16px; border-radius: 100px; text-transform: uppercase; }
  .refresh-info { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .pulse { width: 8px; height: 8px; background: var(--teal); border-radius: 50%; animation: pulse 1.5s infinite; display: inline-block; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }

  /* TITLE */
  .title-wrap { text-align: center; }
  .title { font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 900; background: linear-gradient(135deg, #e8f0ff 30%, var(--teal)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.1; }
  .subtitle { color: var(--muted); font-size: 15px; margin-top: 8px; }

  /* STATS ROW */
  .stats-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .stat-chip { background: var(--surface); border: 1px solid var(--surface2); border-radius: 12px; padding: 12px 24px; text-align: center; min-width: 120px; }
  .stat-chip .num { font-size: 1.8rem; font-weight: 800; color: var(--teal); display: block; }
  .stat-chip .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

  /* LEADERBOARD */
  .lb-wrap { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 10px; }

  .lb-row {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--surface2);
    border-radius: 16px;
    padding: 16px 24px;
    animation: slideIn .4s ease;
    transition: transform .2s;
  }
  .lb-row:hover { transform: translateX(4px); }

  @keyframes slideIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

  .lb-row.rank-1 { border-color: var(--gold); background: rgba(251,191,36,.06); }
  .lb-row.rank-2 { border-color: var(--silver); background: rgba(203,213,225,.04); }
  .lb-row.rank-3 { border-color: var(--bronze); background: rgba(205,124,74,.04); }

  .lb-medal { font-size: 2rem; min-width: 44px; text-align: center; flex-shrink: 0; }
  .lb-rank-num { font-size: 1.3rem; font-weight: 800; color: var(--muted); min-width: 44px; text-align: center; flex-shrink: 0; }

  .lb-name { flex: 1; font-size: clamp(1.1rem, 2.5vw, 1.5rem); font-weight: 700; }

  .lb-score-wrap { text-align: right; flex-shrink: 0; }
  .lb-score { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 900; color: var(--teal); display: block; }
  .lb-pct { font-size: 13px; color: var(--muted); }

  .lb-bar-wrap { width: 120px; flex-shrink: 0; }
  .lb-bar-bg { background: var(--surface2); border-radius: 100px; height: 8px; overflow: hidden; }
  .lb-bar-fill { height: 100%; border-radius: 100px; background: linear-gradient(90deg, var(--teal), #6366f1); transition: width 1s ease; }

  /* EMPTY STATE */
  .empty { text-align: center; color: var(--muted); font-size: 16px; padding: 48px; background: var(--surface); border-radius: 16px; width: 100%; max-width: 900px; }
  .empty .big { font-size: 3rem; margin-bottom: 12px; }

  /* FOOTER */
  .footer { color: var(--muted); font-size: 12px; text-align: center; }
  .quiz-link { color: var(--teal); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>

<div class="header">
  <div class="logo-pill">The Collective X</div>
  <div class="refresh-info">
    <span class="pulse"></span>
    <span id="refresh-msg">Auto-refreshing every 10 seconds</span>
  </div>
</div>

<div class="title-wrap">
  <h1 class="title">🏆 Live Leaderboard</h1>
  <p class="subtitle" id="subtitle">Waiting for scores to come in…</p>
</div>

<div class="stats-row">
  <div class="stat-chip"><span class="num" id="stat-players">—</span><span class="lbl">Players</span></div>
  <div class="stat-chip"><span class="num" id="stat-top">—</span><span class="lbl">Top Score</span></div>
  <div class="stat-chip"><span class="num" id="stat-avg">—</span><span class="lbl">Avg Score</span></div>
</div>

<div class="lb-wrap" id="lb-wrap">
  <div class="empty"><div class="big">👀</div>Waiting for the first score to come in…<br><br>Share the quiz link with your team to get started!</div>
</div>

<div class="footer">
  Team quiz link → <a class="quiz-link" href="https://melb4a.github.io/tcx-quiz" target="_blank">melb4a.github.io/tcx-quiz</a>
  &nbsp;·&nbsp; Refreshes automatically
</div>

<script>
const STORAGE_KEY = 'tcx_quiz_leaderboard';
const medals = ['🥇','🥈','🥉'];

async function loadLeaderboard() {
  try {
    let entries = [];
    try {
      const res = await window.storage.get(STORAGE_KEY, true);
      if (res && res.value) entries = JSON.parse(res.value);
    } catch(e) { entries = []; }

    const wrap = document.getElementById('lb-wrap');

    if (!entries.length) {
      wrap.innerHTML = `<div class="empty"><div class="big">👀</div>Waiting for the first score to come in…<br><br>Share the quiz link with your team to get started!</div>`;
      document.getElementById('stat-players').textContent = '0';
      document.getElementById('stat-top').textContent = '—';
      document.getElementById('stat-avg').textContent = '—';
      document.getElementById('subtitle').textContent = 'Waiting for scores to come in…';
      return;
    }

    // Sort best score first
    entries.sort((a, b) => b.score - a.score || b.pct - a.pct || b.ts - a.ts);

    // Stats
    const topScore = entries[0];
    const avg = Math.round(entries.reduce((s, e) => s + e.pct, 0) / entries.length);
    document.getElementById('stat-players').textContent = entries.length;
    document.getElementById('stat-top').textContent = topScore.pct + '%';
    document.getElementById('stat-avg').textContent = avg + '%';
    document.getElementById('subtitle').textContent = `${entries.length} player${entries.length > 1 ? 's' : ''} on the board — keep going!`;

    wrap.innerHTML = entries.slice(0, 15).map((e, i) => {
      const isTop3 = i < 3;
      const rankEl = isTop3
        ? `<span class="lb-medal">${medals[i]}</span>`
        : `<span class="lb-rank-num">${i + 1}</span>`;
      const barWidth = e.pct || 0;
      return `
        <div class="lb-row ${isTop3 ? 'rank-' + (i+1) : ''}">
          ${rankEl}
          <span class="lb-name">${e.name}</span>
          <div class="lb-bar-wrap">
            <div class="lb-bar-bg">
              <div class="lb-bar-fill" style="width:${barWidth}%"></div>
            </div>
          </div>
          <div class="lb-score-wrap">
            <span class="lb-score">${e.score}/${e.total}</span>
            <span class="lb-pct">${e.pct}%</span>
          </div>
        </div>`;
    }).join('');

  } catch(err) {
    document.getElementById('refresh-msg').textContent = 'Could not load scores';
  }
}

// Load on start, then every 10 seconds
loadLeaderboard();
setInterval(() => {
  loadLeaderboard();
  const msg = document.getElementById('refresh-msg');
  msg.textContent = 'Refreshed just now';
  setTimeout(() => msg.textContent = 'Auto-refreshing every 10 seconds', 2000);
}, 10000);
</script>
</body>
</html>
